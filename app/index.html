<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Free My TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/*
 * The Free My TV look, in CSS: measurements in a 1920×1080 space (the stage is scaled to the TV), the tvOS safe
 * area (80 px from the sides), light by day and dark at night. No backdrop-filter: the TV's GPU is weak, so the glass
 * is drawn with translucent fills over one pre-blurred photo.
 */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
body {
  font-family: "Inter", "SamsungOne", "Samsung Sans", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  cursor: none;
  --ink: #1d1d1f; --dim: #6e6e73; --faint: #8e8e93;
  --glass: rgba(255, 255, 255, 0.58); --glass-low: rgba(255, 255, 255, 0.40); --edge: rgba(255, 255, 255, 0.95);
  --lift: rgba(0, 0, 0, 0.16); --pill: rgba(255, 255, 255, 0.92); --up: #1f9d48; --down: #d93025;
}
body.night {
  --ink: #f5f5f7; --dim: rgba(235, 235, 245, 0.62); --faint: rgba(235, 235, 245, 0.42);
  --glass: rgba(44, 46, 54, 0.62); --glass-low: rgba(30, 32, 38, 0.50); --edge: rgba(255, 255, 255, 0.16);
  --lift: rgba(0, 0, 0, 0.45); --pill: rgba(255, 255, 255, 0.16); --up: #30d158; --down: #ff453a;
}

#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; color: var(--ink); }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.ico { display: inline-block; width: 40px; height: 40px; background: currentColor;
  -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }

/* MARK: Sky and background photo */
#sky { background: linear-gradient(170deg, #f2f2f5 0%, #e3e4e9 55%, #d6d8de 100%); }
#skyNight { background: linear-gradient(170deg, #1a1d24 0%, #0f1116 55%, #08090c 100%); opacity: 0; transition: opacity 2s ease; }
body.night #skyNight { opacity: 1; }
.bg { position: absolute; left: -120px; top: -120px; width: 2160px; height: 1320px; object-fit: cover;
  filter: blur(70px) saturate(1.5); opacity: 0; transition: opacity 0.8s ease; will-change: opacity; }
.bg.on { opacity: 0.55; }
body.night .bg.on { opacity: 0.42; }
#wash { background: rgba(244, 244, 247, 0.52); transition: background 2s ease, opacity 0.6s ease; }
body.night #wash { background: rgba(10, 11, 14, 0.58); }
body.drawer #wash { background: rgba(250, 250, 252, 0.70); }
body.night.drawer #wash { background: rgba(6, 7, 9, 0.74); }

/* MARK: Page (moves up when the drawer opens) */
#page { transition: transform 0.55s cubic-bezier(0.2, 0.9, 0.25, 1); will-change: transform; }
body.drawer #page { transform: translateY(-560px); }
#top, #cards { transition: opacity 0.4s ease; }
body.drawer #top, body.drawer #cards { opacity: 0; }

/* MARK: Title, tabs, buttons, quotes */
#title { position: absolute; left: 76px; top: 52px; font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 104px;
  color: var(--ink); transition: color 2s ease; white-space: nowrap; }
#tabs { position: absolute; left: 56px; top: 158px; height: 68px; display: flex; }
.tab { height: 68px; line-height: 68px; padding: 0 24px; margin-right: 12px; border-radius: 34px; font-size: 34px; font-weight: 500;
  color: var(--faint); transition: color 0.25s ease, background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease; }
.tab.on { color: var(--ink); font-weight: 600; }
.tab.focus { background: var(--pill); color: var(--ink); box-shadow: 0 10px 30px var(--lift); transform: scale(1.06); }
body.night .tab.focus { background: #f5f5f7; color: #1d1d1f; }

#buttons { position: absolute; right: 80px; top: 69px; display: flex; }
.btn { position: relative; width: 68px; height: 68px; margin-left: 20px; border-radius: 34px; display: flex; align-items: center;
  justify-content: center; color: var(--ink); background: var(--glass); border: 2px solid var(--edge);
  box-shadow: 0 6px 18px var(--lift); transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease; }
.btn .ico { width: 34px; height: 34px; }
.btn.focus { transform: scale(1.14); background: #ffffff; color: #1d1d1f; box-shadow: 0 14px 34px var(--lift); }
.tip { position: absolute; top: 86px; right: 0; font-size: 22px; font-weight: 500; color: var(--dim); white-space: nowrap;
  opacity: 0; transition: opacity 0.2s ease; }
.btn.focus .tip { opacity: 1; }
#mini { position: absolute; right: 80px; top: 176px; display: flex; font-size: 23px; font-weight: 500; color: var(--faint);
  transition: color 2s ease; letter-spacing: 0.2px; }
#mini span { margin-left: 26px; white-space: nowrap; }

/* MARK: The three picks */
#cards { position: absolute; left: 0; top: 0; }
.card { position: absolute; top: 262px; height: 442px; border-radius: 22px; overflow: visible; }
.card .art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 22px; overflow: hidden;
  background: var(--glass-low); box-shadow: 0 10px 30px var(--lift);
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.25, 1), box-shadow 0.3s ease; will-change: transform; }
.card .art img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.6s ease; }
.card .art img.ready { opacity: 1; }
.card.focus .art { transform: scale(1.045); box-shadow: 0 34px 60px var(--lift); }
.card .name { position: absolute; left: 2px; top: 462px; width: 100%; font-size: 34px; font-weight: 600; letter-spacing: 0.4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); transition: color 2s ease, transform 0.3s ease; }
.card .meta { position: absolute; left: 2px; top: 506px; width: 980px; font-size: 26px; font-weight: 500; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.25s ease, color 2s ease; }
.card.tall .meta { opacity: 0; width: 640px; }
.card.tall:last-child .meta { left: auto; right: 0; text-align: right; }
.card.tall.focus .meta { opacity: 1; }
.card.focus .name { transform: translateY(10px); }
.card.focus .meta { transform: translateY(10px); }
.card .play { position: absolute; right: 22px; bottom: 22px; height: 56px; padding: 0 26px 0 20px; border-radius: 28px;
  background: rgba(255, 255, 255, 0.94); color: #1d1d1f; font-size: 24px; font-weight: 600; line-height: 56px; display: flex;
  align-items: center; opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease; }
.card .play .ico { width: 22px; height: 22px; margin-right: 10px; }
.card.focus .play { opacity: 1; transform: none; }
.card.ghost .art { background: var(--glass-low); }
.card.ghost .art::after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
  background-size: 300% 100%; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

#notice { position: absolute; left: 80px; top: 262px; width: 1760px; height: 442px; border-radius: 22px; padding: 70px 90px;
  background: var(--glass); border: 2px solid var(--edge); box-shadow: 0 10px 30px var(--lift); color: var(--ink);
  transition: transform 0.3s ease, box-shadow 0.3s ease; }
#notice.focus { transform: scale(1.02); box-shadow: 0 30px 60px var(--lift); }
#notice h2 { font-size: 52px; font-weight: 700; letter-spacing: -0.8px; margin-bottom: 22px; }
#notice p { font-size: 30px; line-height: 44px; color: var(--dim); max-width: 1300px; }
#notice .action { display: inline-block; margin-top: 40px; height: 64px; line-height: 64px; padding: 0 34px; border-radius: 32px;
  background: var(--ink); color: var(--glass-solid, #fff); font-size: 28px; font-weight: 600; opacity: 0.5; transition: opacity 0.25s; }
body.night #notice .action { color: #1d1d1f; }
#notice.focus .action { opacity: 1; }

/* MARK: Shelf */
#platter { position: absolute; left: 40px; top: 814px; width: 1840px; height: 206px; border-radius: 64px;
  background: linear-gradient(180deg, var(--glass), var(--glass-low)); border: 2px solid var(--edge);
  box-shadow: 0 24px 60px var(--lift), inset 0 2px 0 rgba(255, 255, 255, 0.35); transition: background 2s ease, border-color 2s ease; }
#shelf { position: absolute; left: 0; top: 38px; width: 100%; height: 126px; display: flex; justify-content: center; }
.tile { position: relative; width: 210px; height: 126px; margin: 0 24px; border-radius: 22px; display: flex; align-items: center;
  justify-content: center; font-size: 32px; font-weight: 800; letter-spacing: -0.6px; white-space: nowrap;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.25, 1), box-shadow 0.3s ease;
  will-change: transform; }
.tile.focus { transform: scale(1.2); box-shadow: 0 26px 40px rgba(0, 0, 0, 0.32); z-index: 2; }
.tile .first { font-size: 64px; font-weight: 700; }
#shelfEmpty { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center;
  justify-content: center; font-size: 28px; color: var(--dim); }

/* MARK: Drawer (↓ on the shelf) */
#drawer { position: absolute; left: 0; top: 1100px; width: 1920px; height: 460px; }
.glass { position: absolute; border-radius: 40px; background: linear-gradient(180deg, var(--glass), var(--glass-low));
  border: 2px solid var(--edge); box-shadow: 0 20px 50px var(--lift); color: var(--ink); }
#weather { left: 80px; top: 0; width: 1040px; height: 420px; padding: 38px 48px; }
#weather .city { font-size: 26px; font-weight: 600; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; }
#weather .now { display: flex; align-items: center; margin-top: 6px; }
#weather .temp { font-size: 112px; font-weight: 300; letter-spacing: -4px; line-height: 124px; }
#weather .now .ico { width: 84px; height: 84px; margin: 0 26px 0 22px; }
#weather .cond { font-size: 32px; font-weight: 600; }
#weather .range { font-size: 26px; color: var(--dim); margin-top: 6px; }
#weather .sun { position: absolute; right: 48px; top: 48px; text-align: right; font-size: 26px; color: var(--dim); line-height: 46px; }
#weather .sun .ico { width: 34px; height: 30px; vertical-align: -6px; margin-right: 10px; }
#hours { position: absolute; left: 48px; right: 48px; bottom: 34px; display: flex; justify-content: space-between;
  border-top: 2px solid var(--edge); padding-top: 20px; }
.hour { width: 100px; text-align: center; font-size: 24px; color: var(--dim); }
.hour .ico { width: 42px; height: 42px; margin: 8px 0 4px; color: var(--ink); }
.hour b { display: block; color: var(--ink); font-size: 28px; font-weight: 600; }
#market { left: 1160px; top: 0; width: 680px; height: 420px; padding: 38px 48px; }
#market .head { font-size: 26px; font-weight: 600; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px; }
.coin { display: flex; align-items: center; height: 76px; border-bottom: 2px solid var(--edge); }
.coin:last-child { border-bottom: 0; }
.coin .n { flex: 1; font-size: 30px; font-weight: 600; }
.coin .n small { font-size: 22px; font-weight: 500; color: var(--faint); margin-left: 10px; }
.coin .p { font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
.coin .c { width: 130px; text-align: right; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.coin .c.up { color: var(--up); } .coin .c.down { color: var(--down); }
.hint { position: absolute; left: 0; top: 432px; width: 1920px; text-align: center; font-size: 22px; color: var(--faint); }

/* MARK: Sheets (All apps, Settings) */
.sheet { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; visibility: hidden;
  transition: opacity 0.35s ease, visibility 0s linear 0.35s; }
.sheet.open { opacity: 1; visibility: visible; transition: opacity 0.35s ease; }
.sheet .back { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(242, 242, 246, 0.97); }
body.night .sheet .back { background: rgba(12, 13, 16, 0.97); }
#page { transition: transform 0.55s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.35s ease; }
body.sheeted #page { opacity: 0; }
.sheet h1 { position: absolute; left: 80px; top: 60px; font-size: 72px; font-weight: 700; letter-spacing: -1.5px; color: var(--ink); }
.sheet .sub { position: absolute; left: 84px; top: 148px; font-size: 26px; color: var(--dim); }
#gridWrap { position: absolute; left: 0; top: 196px; width: 1920px; height: 884px; overflow: hidden; }
#grid { position: absolute; left: 130px; top: 20px; width: 1700px; transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1); }
.cell { position: absolute; width: 300px; height: 169px; border-radius: 22px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 0 18px; font-size: 28px; font-weight: 700;
  background: var(--glass); border: 2px solid var(--edge); color: var(--ink); box-shadow: 0 6px 16px var(--lift);
  transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.25, 1), box-shadow 0.28s ease; }
.cell.brand { border: 0; }
.cell.focus { transform: scale(1.12); box-shadow: 0 26px 44px var(--lift); z-index: 2; }
.cell small { display: block; font-size: 17px; font-weight: 500; opacity: 0.7; margin-top: 8px; word-break: break-all; }

#settingsList { position: absolute; left: 360px; top: 210px; width: 1200px; }
.row { display: flex; align-items: center; height: 76px; padding: 0 34px; margin-bottom: 8px; border-radius: 22px; font-size: 30px;
  font-weight: 500; color: var(--ink); transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
.row .v { margin-left: auto; color: var(--dim); font-weight: 500; }
.row { position: relative; }
.row .v.opt { position: relative; }
.row .v.opt::before { content: "‹"; position: absolute; left: -34px; opacity: 0; }
.row .v.opt::after { content: "›"; position: absolute; right: -26px; opacity: 0; }
.row .v { margin-right: 26px; }
.row.focus { background: #ffffff; color: #1d1d1f; transform: scale(1.03); box-shadow: 0 16px 36px var(--lift); }
.row.focus .v { color: #6e6e73; }
.row.focus .v.opt::before, .row.focus .v.opt::after { opacity: 1; }
#settingsFoot { position: absolute; left: 360px; bottom: 40px; width: 1200px; text-align: center; font-size: 20px; line-height: 30px; color: var(--faint); }

/* MARK: Text input (opens the TV's keyboard) */
#ask { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.55); display: none; }
#ask.open { display: block; }
#ask .box { position: absolute; left: 410px; top: 200px; width: 1100px; padding: 50px 56px; border-radius: 40px; background: #f5f5f7;
  color: #1d1d1f; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4); }
#ask h3 { font-size: 40px; font-weight: 700; margin-bottom: 12px; }
#ask p { font-size: 24px; line-height: 34px; color: #6e6e73; margin-bottom: 30px; }
#ask input { width: 100%; height: 84px; border-radius: 20px; border: 3px solid #0a84ff; padding: 0 28px; font-size: 34px;
  font-family: inherit; color: #1d1d1f; background: #fff; outline: none; }

/* MARK: Toast */
#toast { position: absolute; left: 50%; top: 40px; max-width: 1200px; transform: translate(-50%, -30px); padding: 20px 36px;
  border-radius: 40px; background: rgba(28, 28, 30, 0.88); color: #f5f5f7; font-size: 28px; font-weight: 500; opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* MARK: Screensaver */
#saver { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; visibility: hidden;
  transition: opacity 1.2s ease, visibility 0s linear 1.2s; }
#saver.on { opacity: 1; visibility: visible; transition: opacity 1.2s ease; }
#saver img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; opacity: 0;
  transition: opacity 1.6s ease; transform: scale(1.0); }
#saver img.on { opacity: 1; animation: drift 24s linear forwards; }
@keyframes drift { from { transform: scale(1.0); } to { transform: scale(1.08) translateX(-20px); } }
#saver .shade { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(0deg, rgba(0, 0, 0, 0.55), transparent 45%),
  linear-gradient(200deg, rgba(0, 0, 0, 0.35), transparent 40%); }
#clock { position: absolute; right: 80px; top: 64px; padding: 26px 46px; border-radius: 44px; text-align: right; color: #fff;
  background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.28); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
#clock .t { font-size: 120px; font-weight: 300; letter-spacing: -4px; line-height: 132px; font-variant-numeric: tabular-nums; }
#clock .d { font-size: 28px; font-weight: 500; opacity: 0.8; }
#saverTitle { position: absolute; left: 80px; bottom: 70px; color: #fff; }
#saverTitle b { display: block; font-size: 56px; font-weight: 700; letter-spacing: -0.8px; }

<div id="stage">
  <div id="sky" class="layer"></div>
  <div id="skyNight" class="layer"></div>
  <img id="bgA" class="bg" alt=""><img id="bgB" class="bg" alt="">
  <div id="wash" class="layer"></div>

  <div id="page" class="layer">
    <div id="top">
      <div id="title"></div>
      <div id="tabs"></div>
      <div id="buttons"></div>
      <div id="mini"></div>
    </div>
    <div id="cards"></div>
    <div id="platter"><div id="shelf"></div></div>
    <div id="drawer">
      <div id="weather" class="glass"></div>
      <div id="market" class="glass"></div>
      <div class="hint" id="drawerHint"></div>
    </div>
  </div>

  <div id="appsSheet" class="sheet">
    <div class="back"></div>
    <h1 id="appsTitle"></h1>
    <div class="sub" id="appsSub"></div>
    <div id="gridWrap"><div id="grid"></div></div>
  </div>

  <div id="settingsSheet" class="sheet">
    <div class="back"></div>
    <h1 id="settingsTitle"></h1>
    <div class="sub" id="settingsSub"></div>
    <div id="settingsList"></div>
    <div id="settingsFoot"></div>
  </div>

  <div id="ask">
    <div class="box">
      <h3 id="askTitle"></h3>
      <p id="askHint"></p>
      <input id="askInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </div>

  <div id="saver">
    <img id="svA" alt=""><img id="svB" alt="">
    <div class="shade"></div>
    <div id="clock"><div class="t" id="clockT"></div><div class="d" id="clockD"></div></div>
    <div id="saverTitle"><b id="saverName"></b><span id="saverMeta"></span></div>
  </div>

  <div id="toast"></div>
</div>
<script>
/*
 * Free My TV for Samsung (Tizen): default settings.
 *
 * Everything here can also be changed on the TV (the gear button), and what you set there wins.
 * This file is public on GitHub: do NOT put your TMDB key here. Type it on the TV, in Settings.
 */
var FMT_CONFIG = {
  // Your city, for the weather and the sunset that turns the screen dark at night.
  city: "São Paulo",
  latitude: -23.5505,
  longitude: -46.6333,

  // Country (two letters): which titles are on which streaming app.
  tmdbRegion: "BR",

  // "pt" or "en"
  language: "pt",

  // Crypto prices: BRL, USD or EUR. In BRL the US dollar is shown too.
  currency: "BRL",

  // "C" or "F"
  temperature: "C",

  // "auto" (follows the sunset), "light" or "dark"
  look: "auto",

  // Minutes without touching the remote before the screensaver (0 = off).
  screensaverMinutes: 10,

  // Shelf order. Only the ones installed on the TV show up (up to 7).
  shelf: ["netflix", "youtube", "globoplay", "prime", "disney", "max", "appletv",
          "paramount", "crunchyroll", "spotify", "plutotv", "twitch"],

  // If the TV doesn't tell which apps it has, the shelf uses these Tizen app ids instead.
  // Find an app's id in Settings → "Apps found on the TV". Example: { youtube: "9Ur5IzDKqV.TizenYouTube" }
  appIds: {}
};

</script>
<script src="config.js"></script>
<script>
/*
 * The TV: which apps it has, opening them, and the remote's keys.
 * On a computer (no `tizen` object) it runs in demo mode with every service "installed", so the screen can be
 * designed in a normal browser.
 */
var TV = (function () {
  var isTizen = typeof window.tizen !== "undefined" && !!window.tizen.application;

  /*
   * Streaming services: key, name on screen, how to spot the app on the TV (by its name), how to spot it on TMDB
   * (part of the provider name, lowercase) and the tile colors (top, bottom, text).
   * Edit freely: add a line to put another app on the shelf.
   */
  var SERVICES = [
    { key: "netflix",     name: "Netflix",     app: /netflix/i,                      tmdb: "netflix",     colors: ["#0a0a0a", "#000000", "#e50914"] },
    { key: "youtube",     name: "YouTube",     app: /^youtube$|youtube(?!.*(kids|music))/i, tmdb: null,  colors: ["#ffffff", "#ececec", "#ff0033"] },
    { key: "globoplay",   name: "Globoplay",   app: /globoplay/i,                    tmdb: "globoplay",   colors: ["#ff8a1f", "#ff2d5a", "#ffffff"] },
    { key: "prime",       name: "Prime Video", app: /prime video/i,                  tmdb: "prime video", colors: ["#2aa8ff", "#0a68d4", "#ffffff"] },
    { key: "disney",      name: "Disney+",     app: /disney/i,                       tmdb: "disney",      colors: ["#173584", "#08143f", "#ffffff"] },
    { key: "max",         name: "Max",         app: /^max$|hbo|\bmax\b/i,            tmdb: "max",         colors: ["#5c30e8", "#221684", "#ffffff"] },
    { key: "appletv",     name: "Apple TV",    app: /apple tv/i,                     tmdb: "apple tv",    colors: ["#1c1c1e", "#000000", "#ffffff"] },
    { key: "paramount",   name: "Paramount+",  app: /paramount/i,                    tmdb: "paramount",   colors: ["#0064ff", "#0033a0", "#ffffff"] },
    { key: "crunchyroll", name: "Crunchyroll", app: /crunchyroll/i,                  tmdb: "crunchyroll", colors: ["#f8822a", "#e0561b", "#ffffff"] },
    { key: "spotify",     name: "Spotify",     app: /spotify/i,                      tmdb: null,          colors: ["#1db954", "#128a3e", "#ffffff"] },
    { key: "plutotv",     name: "Pluto TV",    app: /pluto/i,                        tmdb: null,          colors: ["#2b2b2b", "#111111", "#fff200"] },
    { key: "twitch",      name: "Twitch",      app: /twitch/i,                       tmdb: null,          colors: ["#9146ff", "#5c2bb0", "#ffffff"] }
  ];

  // Kept out of "All apps": the TV's own pieces that aren't worth a tile.
  var HIDDEN = /tizenbrew|smart ?hub|^e-manual|^manual|universal guide|gallery|samsung health|bixby|alexa|samsung account/i;

  var apps = [];          // every app the TV shows in its launcher: { id, name }
  var found = {};         // service key → app id
  var known = false;      // the TV listed its apps

  function serviceForTmdb(providerName) {
    var n = String(providerName || "").toLowerCase();
    for (var i = 0; i < SERVICES.length; i++) {
      var s = SERVICES[i];
      if (!s.tmdb) continue;
      if (s.tmdb === "max" ? /\bmax\b/.test(n) : n.indexOf(s.tmdb) >= 0) return s;
    }
    return null;
  }

  function service(key) {
    for (var i = 0; i < SERVICES.length; i++) if (SERVICES[i].key === key) return SERVICES[i];
    return null;
  }

  function match(list) {
    found = {};
    list.forEach(function (a) {
      SERVICES.forEach(function (s) {
        if (!found[s.key] && s.app.test(a.name)) found[s.key] = a.id;
      });
    });
    var ids = (window.FMT_CONFIG && FMT_CONFIG.appIds) || {};
    Object.keys(ids).forEach(function (k) { if (ids[k]) found[k] = ids[k]; });
  }

  /** Reads the TV's apps; `done(ok)` when it's known. */
  function load(done) {
    if (!isTizen) {
      apps = SERVICES.map(function (s) { return { id: "demo." + s.key, name: s.name }; })
        .concat([{ id: "demo.browser", name: "Internet" }, { id: "demo.music", name: "Música" }, { id: "demo.gallery2", name: "Fotos" }]);
      match(apps);
      known = true;
      done(true);
      return;
    }
    try {
      tizen.application.getAppsInfo(function (list) {
        apps = list.filter(function (a) { return a.show !== false && a.name && !HIDDEN.test(a.name); })
          .map(function (a) { return { id: a.id, name: a.name }; })
          .sort(function (a, b) { return a.name.localeCompare(b.name); });
        match(apps);
        known = true;
        done(true);
      }, function () {
        match([]);
        done(false);
      });
    } catch (e) {
      match([]);
      done(false);
    }
  }

  /** Opens an app by its Tizen id. */
  function launch(id, fail) {
    if (!id) { if (fail) fail(); return; }
    if (!isTizen) { console.log("[demo] open", id); return; }
    try {
      tizen.application.launch(id, null, function () { if (fail) fail(); });
    } catch (e) {
      if (fail) fail();
    }
  }

  // Remote keys (Tizen key codes plus the computer's for demo mode).
  var KEY = {
    LEFT: [37], UP: [38], RIGHT: [39], DOWN: [40],
    ENTER: [13],
    BACK: [10009, 8, 27],          // Back; Backspace / Esc on a computer
    DONE: [65376], CANCEL: [65385], // on-screen keyboard
    RED: [403], GREEN: [404], YELLOW: [405], BLUE: [406]
  };

  function key(e) {
    var c = e.keyCode;
    for (var k in KEY) if (KEY[k].indexOf(c) >= 0) return k;
    return null;
  }

  return {
    isTizen: isTizen,
    SERVICES: SERVICES,
    service: service,
    serviceForTmdb: serviceForTmdb,
    load: load,
    launch: launch,
    key: key,
    apps: function () { return apps; },
    appId: function (k) { return found[k] || null; },
    has: function (k) { return !!found[k]; },
    known: function () { return known; }
  };
})();

;
/*
 * Settings, picks (TMDB), weather (Open-Meteo) and prices (Binance), ported from the Android version's Recs.java and
 * HomeData.java. Everything is cached in localStorage so the screen paints at once when TizenBrew opens it.
 */

// MARK: - Storage and settings

var Store = {
  get: function (k, fallback) {
    try {
      var v = localStorage.getItem("fmt." + k);
      return v == null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  },
  set: function (k, v) {
    try { localStorage.setItem("fmt." + k, JSON.stringify(v)); } catch (e) { /* storage blocked: lives in memory */ }
  }
};

var Settings = (function () {
  var s = {};
  var saved = Store.get("settings", {});
  Object.keys(FMT_CONFIG).forEach(function (k) { s[k] = FMT_CONFIG[k]; });
  Object.keys(saved).forEach(function (k) { s[k] = saved[k]; });
  if (s.tmdbKey === undefined) s.tmdbKey = "";
  return {
    all: s,
    get: function (k) { return s[k]; },
    set: function (k, v) {
      s[k] = v;
      saved[k] = v;
      Store.set("settings", saved);
    }
  };
})();

function en() { return Settings.get("language") === "en"; }
function tr(pt, eng) { return en() ? eng : pt; }

function getJSON(url, headers, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = timeoutMs || 10000;
    if (headers) Object.keys(headers).forEach(function (h) { x.setRequestHeader(h, headers[h]); });
    x.onload = function () {
      if (x.status === 200) {
        try { resolve(JSON.parse(x.responseText)); } catch (e) { reject(new Error("bad JSON")); }
      } else {
        var err = new Error("HTTP " + x.status);
        err.status = x.status;
        reject(err);
      }
    };
    x.onerror = function () { reject(new Error("network")); };
    x.ontimeout = function () { reject(new Error("timeout")); };
    x.send();
  });
}

// MARK: - Picks (TMDB)

var Recs = (function () {
  var API = "https://api.themoviedb.org/3";
  var LIST_EVERY = 6 * 3600e3;
  var VERSION = 2;
  var GENRES_PT = {
    "Action & Adventure": "Ação e Aventura", "Sci-Fi & Fantasy": "Ficção Científica e Fantasia",
    "War & Politics": "Guerra e Política", "Kids": "Infantil", "News": "Notícias", "Soap": "Novela", "Talk": "Entrevistas"
  };

  var cache = Store.get("recs", null);
  if (!cache || cache.version !== VERSION) cache = { version: VERSION, picks: [], at: 0, lang: "", region: "", services: "" };
  var fetching = false;
  var error = "";
  var listeners = [];

  function key() { return String(Settings.get("tmdbKey") || "").trim(); }
  function lang() { return en() ? "en-US" : "pt-BR"; }
  function region() { return String(Settings.get("tmdbRegion") || "BR").toUpperCase(); }

  /** The services the TV has (by key); if the TV couldn't tell, every one TMDB knows. */
  function available() {
    var keys = TV.SERVICES.filter(function (s) { return s.tmdb && (TV.has(s.key) || !TV.known()); })
      .map(function (s) { return s.key; });
    return keys;
  }

  function tmdb(path) {
    var k = key();
    if (!k) return Promise.reject(new Error("no key"));
    var bearer = k.indexOf("eyJ") === 0;   // read access token (v4) or API key (v3)
    var url = API + path + (bearer ? "" : (path.indexOf("?") >= 0 ? "&" : "?") + "api_key=" + encodeURIComponent(k));
    return getJSON(url, bearer ? { Authorization: "Bearer " + k, Accept: "application/json" } : { Accept: "application/json" });
  }

  function day(offset) {
    var d = new Date(Date.now() + offset * 864e5);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function pickFrom(o, kind) {
    if (!o.backdrop_path) return null;
    return { id: o.id, kind: kind, title: kind === "movie" ? o.title : o.name, backdrop: o.backdrop_path, meta: "", app: null };
  }

  /** The best backdrop: no text written on it, the widest, then the best rated. */
  function bestBackdrop(images) {
    var list = (images && images.backdrops) || [], best = null, bestScore = -1;
    list.forEach(function (b) {
      if (!b.file_path) return;
      var score = (b.iso_639_1 == null ? 1e7 : 0) + Math.min(b.width || 0, 3840) * 100 + (b.vote_average || 0);
      if (score > bestScore) { bestScore = score; best = b.file_path; }
    });
    return best;
  }

  /** Genre, runtime (or seasons) and the service it's on, among the ones the TV has. */
  function details(p, have) {
    return tmdb("/" + p.kind + "/" + p.id + "?language=" + lang()
      + "&append_to_response=watch/providers,images&include_image_language=null,pt,en").then(function (o) {
      var best = bestBackdrop(o.images);
      if (best) p.backdrop = best;
      var parts = [];
      if (p.kind === "tv") parts.push(tr("Série", "Series"));
      if (o.genres && o.genres.length) {
        var g = o.genres[0].name;
        parts.push(en() ? g : (GENRES_PT[g] || g));
      }
      if (p.kind === "movie" && o.runtime > 0) {
        var h = Math.floor(o.runtime / 60), m = o.runtime % 60;
        parts.push(en() ? (h ? h + "h " + m + "m" : m + "m") : (h ? h + " h " + m + " min" : m + " min"));
      } else if (p.kind === "tv" && o.number_of_seasons > 0) {
        var n = o.number_of_seasons;
        parts.push(en() ? (n === 1 ? "1 season" : n + " seasons") : (n === 1 ? "1 temporada" : n + " temporadas"));
      }
      var r = o["watch/providers"] && o["watch/providers"].results && o["watch/providers"].results[region()];
      var flat = (r && r.flatrate) || [];
      for (var i = 0; i < flat.length && !p.app; i++) {
        var s = TV.serviceForTmdb(flat[i].provider_name);
        if (s && have.indexOf(s.key) >= 0) p.app = s.key;
      }
      if (p.app) parts.push(TV.service(p.app).name);
      p.meta = parts.join(" · ");
      p.overview = o.overview || "";
      return p;
    });
  }

  /** Runs `fn` over `list`, `n` at a time (the TV's network is slow, TMDB's limit is generous). */
  function pool(list, n, fn) {
    var i = 0, out = [];
    function next() {
      if (i >= list.length) return Promise.resolve();
      var item = list[i++];
      return fn(item).then(function (r) { out.push(r); }, function () { }).then(next);
    }
    var runners = [];
    for (var k = 0; k < n; k++) runners.push(next());
    return Promise.all(runners).then(function () { return out; });
  }

  function alternate(out, seen, a, b, max) {
    for (var i = 0; i < Math.max(a.length, b.length) && out.length < max; i++) {
      if (a[i] && !seen[a[i].kind + a[i].id]) { seen[a[i].kind + a[i].id] = 1; out.push(a[i]); }
      if (b[i] && out.length < max && !seen[b[i].kind + b[i].id]) { seen[b[i].kind + b[i].id] = 1; out.push(b[i]); }
    }
  }

  function fetchList() {
    var have = available();
    var services = {};   // TMDB provider id → service key
    return tmdb("/watch/providers/movie?language=" + lang() + "&watch_region=" + region()).then(function (res) {
      (res.results || []).forEach(function (o) {
        var s = TV.serviceForTmdb(o.provider_name);
        if (s && have.indexOf(s.key) >= 0) services[o.provider_id] = s.key;
      });
      var ids = Object.keys(services);
      if (!ids.length) throw new Error(tr("nenhum app de streaming da TV está no TMDB", "none of the TV's streaming apps are on TMDB"));
      var common = "&language=" + lang() + "&watch_region=" + region()
        + "&with_watch_monetization_types=flatrate&include_adult=false&sort_by=popularity.desc&with_watch_providers="
        + encodeURIComponent(ids.join("|"));
      // 1. Trending this week, only what's on one of the TV's services (the details say where).
      // 2. Recent releases on those services: movies from the past year, shows with an episode in the past 3 months.
      return Promise.all([
        tmdb("/trending/movie/week?language=" + lang()),
        tmdb("/trending/tv/week?language=" + lang()),
        tmdb("/discover/movie?vote_count.gte=30&primary_release_date.gte=" + day(-365) + "&primary_release_date.lte=" + day(0) + common),
        tmdb("/discover/tv?vote_count.gte=20&air_date.gte=" + day(-90) + "&air_date.lte=" + day(0) + common)
      ]);
    }).then(function (r) {
      function take(res, kind, max) {
        return (res.results || []).slice(0, max).map(function (o) { return pickFrom(o, kind); }).filter(Boolean);
      }
      var hotM = take(r[0], "movie", 20), hotT = take(r[1], "tv", 20);
      var newM = take(r[2], "movie", 20), newT = take(r[3], "tv", 20);
      return pool(hotM.concat(hotT), 4, function (p) { return details(p, have); }).then(function () {
        var list = [], seen = {};
        alternate(list, seen, hotM.filter(function (p) { return p.app; }), hotT.filter(function (p) { return p.app; }), 24);
        var fresh = [];
        alternate(fresh, {}, newM, newT, 24);
        fresh = fresh.filter(function (p) { return !seen[p.kind + p.id]; }).slice(0, 24 - list.length);
        return pool(fresh, 4, function (p) { return details(p, have); }).then(function () {
          fresh.forEach(function (p) { if (p.app && list.length < 24) list.push(p); });
          if (!list.length) throw new Error(tr("o TMDB não trouxe recomendações", "TMDB returned no picks"));
          return list;
        });
      });
    });
  }

  function notify() { listeners.forEach(function (l) { l(); }); }

  function refresh(force) {
    if (fetching || !key()) return;
    var stamp = available().join(",");
    var fresh = Date.now() - cache.at < LIST_EVERY && cache.lang === lang() && cache.region === region() && cache.services === stamp;
    if (fresh && !force && cache.picks.length) return;
    fetching = true;
    fetchList().then(function (list) {
      cache = { version: VERSION, picks: list, at: Date.now(), lang: lang(), region: region(), services: stamp };
      Store.set("recs", cache);
      error = "";
    }, function (e) {
      if (e.status === 401) error = tr("O TMDB recusou a chave. Confira em Configurações.", "TMDB rejected the key. Check it in Settings.");
      else if (e.message === "network") error = tr("Sem conexão com o TMDB. Confira a internet da TV.", "No connection to TMDB. Check the TV's internet.");
      else if (e.message === "timeout") error = tr("O TMDB demorou demais para responder.", "TMDB took too long to answer.");
      else if (e.status) error = tr("O TMDB respondeu com erro ", "TMDB answered with error ") + e.status + ".";
      else error = e.message || String(e);
    }).then(function () {
      fetching = false;
      notify();
    });
  }

  /** "Law & Order: Special Victims Unit" → "law & order" (no two picks from the same franchise). */
  function franchise(t) {
    t = String(t || "").toLowerCase();
    var cut = t.indexOf(":");
    if (cut < 0) cut = t.indexOf(" - ");
    return (cut > 0 ? t.slice(0, cut) : t).trim();
  }

  /** This hour's three: "movie", "tv" or null (both). */
  function now(kind) {
    if (!key()) return [];
    var list = cache.picks.filter(function (p) { return (!kind || p.kind === kind) && p.app && TV.service(p.app); });
    if (!list.length) return [];
    var hour = Math.floor(Date.now() / 3600e3), out = [], seen = {};
    for (var i = 0; i < list.length && out.length < 3; i++) {
      var p = list[(hour * 3 + i) % list.length];
      if (!seen[franchise(p.title)]) { seen[franchise(p.title)] = 1; out.push(p); }
    }
    return out;
  }

  /** Every pick, for the screensaver. */
  function all() { return key() ? cache.picks.slice() : []; }

  function image(path, size) { return path ? "https://image.tmdb.org/t/p/" + size + path : ""; }

  return {
    refresh: refresh,
    now: now,
    all: all,
    image: image,
    hasKey: function () { return !!key(); },
    error: function () { return error; },
    fetching: function () { return fetching; },
    listen: function (l) { listeners.push(l); },
    demo: function (list) {
      Settings.all.tmdbKey = Settings.all.tmdbKey || "demo";
      cache = { version: VERSION, picks: list, at: Date.now(), lang: lang(), region: region(), services: available().join(",") };
    }
  };
})();

// MARK: - Weather (Open-Meteo) and prices (Binance)

var HomeData = (function () {
  var weather = Store.get("weather", null);
  var prices = Store.get("prices", null);
  var listeners = [];
  var WEATHER_EVERY = 30 * 60e3, PRICES_EVERY = 5 * 60e3;
  var COINS = ["BTC", "ETH", "SOL", "USDT"];

  function notify() { listeners.forEach(function (l) { l(); }); }

  function weatherUrl() {
    return "https://api.open-meteo.com/v1/forecast?latitude=" + Settings.get("latitude") + "&longitude=" + Settings.get("longitude")
      + "&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset"
      + "&hourly=temperature_2m,weather_code,is_day&timezone=auto&forecast_days=2"
      + (Settings.get("temperature") === "F" ? "&temperature_unit=fahrenheit" : "");
  }

  function loadWeather(force) {
    var where = Settings.get("latitude") + "," + Settings.get("longitude") + Settings.get("temperature");
    if (!force && weather && weather.where === where && Date.now() - weather.at < WEATHER_EVERY) return;
    getJSON(weatherUrl()).then(function (o) {
      weather = { at: Date.now(), where: where, data: o };
      Store.set("weather", weather);
      notify();
    }, function () { });
  }

  function quote() { var c = Settings.get("currency"); return c === "USD" ? "USDT" : c; }
  function coins() { return Settings.get("currency") === "BRL" ? COINS : COINS.slice(0, 3); }

  function loadPrices(force) {
    var q = quote();
    if (!force && prices && prices.quote === q && Date.now() - prices.at < PRICES_EVERY) return;
    var symbols = coins().map(function (c) { return '"' + c + q + '"'; }).join(",");
    getJSON("https://api.binance.com/api/v3/ticker/24hr?type=MINI&symbols=" + encodeURIComponent("[" + symbols + "]")).then(function (list) {
      var out = {};
      list.forEach(function (o) {
        var coin = o.symbol.slice(0, o.symbol.length - q.length);
        var last = parseFloat(o.lastPrice), open = parseFloat(o.openPrice);
        out[coin] = { price: last, change: open > 0 ? (last / open - 1) * 100 : 0 };
      });
      prices = { at: Date.now(), quote: q, data: out };
      Store.set("prices", prices);
      notify();
    }, function () { });
  }

  // Open-Meteo gives the city's local time without a zone ("2026-10-19T17:00") plus its offset.
  function cityNow() {
    var off = weather && weather.data ? weather.data.utc_offset_seconds || 0 : -new Date().getTimezoneOffset() * 60;
    return Date.now() + off * 1000;
  }
  function parseLocal(s) {
    var m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(s || "");
    return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : NaN;
  }

  /** From sunset to sunrise (before the first forecast: 18 h to 6 h). */
  function isNight() {
    var look = Settings.get("look");
    if (look === "dark") return true;
    if (look === "light") return false;
    var d = weather && weather.data && weather.data.daily;
    var now = cityNow();
    if (d && d.sunrise && d.sunset) {
      var rise = parseLocal(d.sunrise[0]), set = parseLocal(d.sunset[0]);
      if (!isNaN(rise) && !isNaN(set) && now - rise < 2 * 864e5) return now < rise || now >= set;
    }
    var h = new Date().getHours();
    return h < 6 || h >= 18;
  }

  function condition(code, isDay) {
    if (code == null || code < 0) return "";
    if (en()) {
      if (code === 0) return "Clear";
      if (code === 1) return isDay ? "Mostly Sunny" : "Mostly Clear";
      if (code === 2) return "Partly Cloudy";
      if (code === 3) return "Cloudy";
      if (code === 45 || code === 48) return "Fog";
      if (code >= 51 && code <= 57) return "Drizzle";
      if (code === 65 || code === 67 || code === 82) return "Heavy Rain";
      if (code >= 71 && code <= 77 || code === 85 || code === 86) return "Snow";
      if (code >= 95) return "Thunderstorms";
      return "Rain";
    }
    if (code === 0) return isDay ? "Céu limpo" : "Noite limpa";
    if (code === 1) return "Poucas nuvens";
    if (code === 2) return "Parcialmente nublado";
    if (code === 3) return "Nublado";
    if (code === 45 || code === 48) return "Neblina";
    if (code >= 51 && code <= 57) return "Garoa";
    if (code === 65 || code === 67 || code === 82) return "Chuva forte";
    if (code >= 71 && code <= 77 || code === 85 || code === 86) return "Neve";
    if (code >= 95) return "Tempestade";
    return "Chuva";
  }

  function icon(code, isDay) {
    if (code === 0) return isDay ? "sunny" : "clear_night";
    if (code === 1 || code === 2) return isDay ? "partly_cloudy_day" : "partly_cloudy_night";
    if (code === 3) return "cloud";
    if (code === 45 || code === 48) return "foggy";
    if (code >= 71 && code <= 77 || code === 85 || code === 86) return "snowflake";
    if (code >= 95) return "thunderstorm";
    return "rainy";
  }

  /** What the drawer shows: now, today's range, sun times and the next hours. */
  function forecast() {
    var o = weather && weather.data;
    if (!o || !o.current) return null;
    var c = o.current, d = o.daily, h = o.hourly;
    var out = {
      temp: Math.round(c.temperature_2m), code: c.weather_code, day: c.is_day === 1,
      max: d ? Math.round(d.temperature_2m_max[0]) : null, min: d ? Math.round(d.temperature_2m_min[0]) : null,
      sunrise: d ? d.sunrise[0].slice(11, 16) : "", sunset: d ? d.sunset[0].slice(11, 16) : "",
      hours: []
    };
    out.text = condition(out.code, out.day);
    out.icon = icon(out.code, out.day);
    if (h && h.time) {
      var now = cityNow();
      for (var i = 0; i < h.time.length && out.hours.length < 8; i++) {
        var t = parseLocal(h.time[i]);
        if (t + 3600e3 <= now) continue;
        var isDay = h.is_day ? h.is_day[i] === 1 : true;
        out.hours.push({
          label: out.hours.length === 0 ? tr("Agora", "Now") : h.time[i].slice(11, 13) + (en() ? "" : " h"),
          temp: Math.round(h.temperature_2m[i]), icon: icon(h.weather_code[i], isDay)
        });
      }
    }
    return out;
  }

  function symbol() {
    var c = Settings.get("currency");
    return c === "BRL" ? "R$ " : c === "EUR" ? "€" : c === "GBP" ? "£" : "$";
  }

  function money(v, compact) {
    if (v == null || isNaN(v)) return symbol() + "—";
    var loc = en() ? "en-US" : "pt-BR";
    if (compact && v >= 1000) {
      var kv = v / 1000;
      return symbol() + kv.toLocaleString(loc, { maximumFractionDigits: kv >= 100 ? 0 : 1 }) + "k";
    }
    return symbol() + v.toLocaleString(loc, v >= 1000 ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /** [{ coin, name, price, change }] in the chosen currency. */
  function quotes() {
    if (!prices || prices.quote !== quote()) return [];
    var names = { BTC: "Bitcoin", ETH: "Ethereum", SOL: "Solana", USDT: tr("Dólar", "Dollar") };
    return coins().map(function (c) {
      var p = prices.data[c];
      return { coin: c, name: names[c], price: p ? p.price : NaN, change: p ? p.change : NaN };
    });
  }

  function start() {
    loadWeather();
    loadPrices();
    setInterval(function () { loadPrices(); }, 60e3);
    setInterval(function () { loadWeather(); }, 5 * 60e3);
  }

  return {
    start: start,
    reload: function () { loadWeather(true); loadPrices(true); },
    forecast: forecast,
    quotes: quotes,
    money: money,
    isNight: isNight,
    listen: function (l) { listeners.push(l); },
    city: function () { return Settings.get("city") || tr("Clima", "Weather"); },
    demo: function (w, p) { weather = w; prices = p; }
  };
})();

/** "Lisboa" → the first match on Open-Meteo's free geocoder. */
function findCity(name) {
  var url = "https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=" + (en() ? "en" : "pt")
    + "&name=" + encodeURIComponent(name);
  return getJSON(url).then(function (o) {
    var r = o.results && o.results[0];
    if (!r) throw new Error("not found");
    return { name: r.name, admin: r.admin1 || "", country: r.country_code || "", latitude: r.latitude, longitude: r.longitude };
  });
}

  ];
  function art(i) {
    var p = palettes[i % palettes.length];

      + "<stop offset='1' stop-color='#fff' stop-opacity='0'/></radialGradient></defs>"
      + "<rect width='1280' height='720' fill='url(#g)'/><rect width='1280' height='720' fill='url(#r)'/>"
      + "<circle cx='" + (300 + i * 97 % 700) + "' cy='" + (420 - i * 53 % 200) + "' r='" + (140 + i * 31 % 120) + "' fill='" + p[2] + "' opacity='0.35'/>"
      + "<path d='M0 560 Q 320 " + (440 + i * 17 % 90) + " 640 540 T 1280 500 V720 H0Z' fill='" + p[0] + "' opacity='0.7'/></svg>";
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  var titles = [
    ["movie", "A Última Estrada", "Ação e Aventura · 2 h 4 min · Netflix", "netflix"],
    ["tv", "Cidade Submersa", "Série · Drama · 2 temporadas · Max", "max"],

    ["movie", "Horizonte Vermelho", "Ficção Científica · 1 h 52 min · Prime Video", "prime"],

    ["movie", "Verão em Lisboa", "Romance · 1 h 38 min · Disney+", "disney"],
    ["tv", "Código Zero", "Série · Mistério · 1 temporada · Apple TV", "appletv"],
    ["movie", "O Farol", "Suspense · 1 h 47 min · Netflix", "netflix"],
    ["tv", "Estação Sertão", "Série · Comédia · 2 temporadas · Globoplay", "globoplay"]
  ];
  var list = titles.map(function (t, i) {
    return { id: 1000 + i, kind: t[0], title: t[1], meta: t[2], app: t[3], backdrop: "demo" + i };
  });
  Recs.demo(list);
  Recs.image = function (path) { return art(parseInt(String(path).replace("demo", ""), 10) || 0); };

  var now = new Date(), hours = [], temps = [], codes = [], days = [];
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  for (var h = 0; h < 48; h++) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h);
    hours.push(d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + "T" + p2(d.getHours()) + ":00");
    temps.push(19 + 7 * Math.sin((h % 24 - 9) / 24 * 2 * Math.PI));
    codes.push([0, 1, 2, 2, 3, 61, 1, 0][h % 8]);
    days.push(h % 24 >= 6 && h % 24 < 18 ? 1 : 0);
  }
  var today = hours[0].slice(0, 10), tomorrow = hours[24].slice(0, 10);
  HomeData.demo({

/*
 * The home screen: title and tabs, three picks for this hour, the app shelf, the drawer (↓ on the shelf) with the
 * weather and prices, "All apps", Settings and a screensaver. Ported from the Android version's HomeView.java.
 *
 * Remote: arrows move, OK opens, Back closes whatever is open.
 */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TABS = [["Explorar", "Explore", null], ["Filmes", "Movies", "movie"], ["Séries", "Shows", "tv"]];
  var MAX_SHELF = 7, COLS = 5, ROW_H = 209;

  var S = {
    zone: "shelf",          // top, cards, shelf, drawer, apps, settings

  var shelf = [], picks = [], grid = [], rows = [], buttons = [];
  var lastKey = Date.now(), hour = -1, bgShown = "", bgFlip = false;

  function el(tag, cls, text) {
    var e = document.createElement(tag);

    if (text != null) e.textContent = text;

  function icon(name) { return el("i", "ico i-" + name); }

  // MARK: - Fit the 1920×1080 stage to the TV

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    $("stage").style.transform = "scale(" + s + ")";
    $("stage").style.left = Math.round((window.innerWidth - 1920 * s) / 2) + "px";
    $("stage").style.top = Math.round((window.innerHeight - 1080 * s) / 2) + "px";

  // MARK: - Toast

  var toastTimer;
  function toast(text) {
    var t = $("toast");
    t.textContent = text;

  }

  // MARK: - Texts that change with the language

  function texts() {
    document.documentElement.lang = en() ? "en" : "pt-BR";

      { k: "apps", icon: "apps", label: tr("Todos os apps", "All apps") },

    var b = $("buttons");
    b.innerHTML = "";
    buttons.forEach(function (x) {
      var d = el("div", "btn");
      d.appendChild(icon(x.icon));
      d.appendChild(el("span", "tip", x.label));

    $("appsTitle").textContent = tr("Todos os apps", "All apps");

    $("settingsSub").textContent = tr("Free My TV para Samsung", "Free My TV for Samsung");
    $("settingsFoot").textContent = tr(
      "Baseado no Free My TV (freemytv.io) · dados: TMDB, Open-Meteo e Binance. Usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.",
      "Based on Free My TV (freemytv.io) · data: TMDB, Open-Meteo and Binance. Uses the TMDB API but is not endorsed or certified by TMDB.");
  }

  // MARK: - Top: tabs and buttons

  function renderTop() {
    var tabs = $("tabs").children, btns = $("buttons").children;
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle("on", i === S.tab);

    }

  }

  function renderMini() {
    var q = HomeData.quotes(), m = $("mini");
    m.innerHTML = "";
    var glyph = { BTC: "₿", ETH: "Ξ", SOL: "◎", USDT: "US$" };
    q.forEach(function (c) {
      if (isNaN(c.price)) return;
      var v = c.coin === "USDT" ? c.price.toLocaleString(en() ? "en-US" : "pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : HomeData.money(c.price, true).replace(/^(R\$ |\$|€|£)/, "");
      m.appendChild(el("span", null, glyph[c.coin] + " " + v));

  // MARK: - The three picks

  function cardsState() {
    if (!Recs.hasKey()) return "nokey";
    if (picks.length) return "picks";

    return Recs.error() ? "error" : "loading";
  }

  function renderCards() {
    var box = $("cards");
    box.innerHTML = "";

    if (state === "picks" || state === "loading") {
      var spots = [{ x: 80, w: 1040 }, { x: 1160, w: 320 }, { x: 1520, w: 320 }];
      spots.forEach(function (sp, i) {
        var p = picks[i];
        var c = el("div", "card" + (i ? " tall" : "") + (p ? "" : " ghost"));
        c.style.left = sp.x + "px";
        c.style.width = sp.w + "px";
        var art = el("div", "art");
        if (p) {
          var img = el("img");
          img.onload = function () { img.classList.add("ready"); };
          img.src = Recs.image(p.backdrop, i ? "w780" : "w1280");
          art.appendChild(img);
          var play = el("div", "play");
          play.appendChild(icon("play"));
          play.appendChild(document.createTextNode(tr("Assistir", "Watch")));
          art.appendChild(play);
        }
        c.appendChild(art);
        if (p) {
          c.appendChild(el("div", "name", p.title));
          c.appendChild(el("div", "meta", p.meta));
        }
        box.appendChild(c);
      });
      if (state === "loading") S.card = 0;
    } else {
      var n = el("div");
      n.id = "notice";
      if (state === "nokey") {
        n.appendChild(el("h2", null, tr("Recomendações desligadas", "Picks are off")));
        n.appendChild(el("p", null, tr(
          "Para ver o que está em alta nos apps que você tem, crie uma chave gratuita no themoviedb.org (Configurações → API) e coloque em Configurações, no botão de engrenagem.",
          "To see what's trending on the apps you have, create a free key at themoviedb.org (Settings → API) and add it in Settings, the gear button.")));
        n.appendChild(el("div", "action", tr("Abrir Configurações", "Open Settings")));
      } else {
        n.appendChild(el("h2", null, tr("Não deu para buscar as recomendações", "Couldn't get the picks")));
        n.appendChild(el("p", null, Recs.error()));
        n.appendChild(el("div", "action", tr("Tentar de novo", "Try again")));
      }
      box.appendChild(n);
    }
    focusCards();
  }

  function cardCount() {
    var st = cardsState();
    return st === "picks" ? picks.length : st === "loading" ? 0 : 1;
  }

  function focusCards() {
    var kids = $("cards").children;
    for (var i = 0; i < kids.length; i++) kids[i].classList.toggle("focus", S.zone === "cards" && S.card === i);
    background();
  }

  function loadPicks() {
    var next = Recs.now(TABS[S.tab][2]);
    var same = next.length === picks.length && next.every(function (p, i) { return p.id === picks[i].id && p.meta === picks[i].meta; });
    picks = next;
    if (S.card >= picks.length) S.card = Math.max(0, picks.length - 1);
    if (!same || !$("cards").children.length) renderCards();
    else focusCards();
  }

  // MARK: - Background: the photo of the focused pick (or the first), heavily blurred

  function background() {
    var p = picks[S.zone === "cards" ? S.card : 0];
    var url = p ? Recs.image(p.backdrop, "w300") : "";
    if (url === bgShown) return;
    bgShown = url;
    var a = $(bgFlip ? "bgA" : "bgB"), b = $(bgFlip ? "bgB" : "bgA");
    bgFlip = !bgFlip;
    if (!url) { a.classList.remove("on"); b.classList.remove("on"); return; }
    a.onload = function () { a.classList.add("on"); b.classList.remove("on"); };
    a.src = url;
  }

  // MARK: - Shelf

  function buildShelf() {
    shelf = [];
    var order = Settings.get("shelf") || [];
    order.forEach(function (k) {
      var s = TV.service(k);
      if (s && TV.has(k) && shelf.length < MAX_SHELF) shelf.push({ key: k, name: s.name, id: TV.appId(k), colors: s.colors });
    });
    var box = $("shelf");
    box.innerHTML = "";
    if (!shelf.length) {
      var e = el("div", null, tr("Nenhum app de streaming encontrado. Veja Todos os apps (botão no canto).", "No streaming apps found. See All apps (corner button)."));
      e.id = "shelfEmpty";
      box.appendChild(e);
    }
    var gap = shelf.length > 6 ? 48 : 56;
    shelf.forEach(function (a) {
      var t = el("div", "tile");
      t.style.margin = "0 " + gap / 2 + "px";
      t.style.background = "linear-gradient(180deg," + a.colors[0] + "," + a.colors[1] + ")";
      t.style.color = a.colors[2];
      t.appendChild(document.createTextNode(a.name));
      box.appendChild(t);
    });
    if (S.shelf >= shelf.length) S.shelf = Math.max(0, shelf.length - 1);
    renderShelf();
  }

  function renderShelf() {
    var kids = $("shelf").querySelectorAll(".tile");
    for (var i = 0; i < kids.length; i++) kids[i].classList.toggle("focus", (S.zone === "shelf" || S.zone === "drawer") && S.shelf === i);

  function open(app) {

      return;
    }
    toast(tr("Abrindo " + app.name + "…", "Opening " + app.name + "…"));

  // MARK: - Drawer: weather and prices

  function renderDrawer() {
    var w = $("weather"), f = HomeData.forecast();

    if (!f) {
      w.appendChild(el("div", "cond", tr("Buscando a previsão…", "Getting the forecast…")));
    } else {
      var now = el("div", "now");

  // MARK: - Text input (the TV's keyboard)

    asking = null;
    $("ask").classList.remove("open");
    $("askInput").blur();
    if (commit && done) done(v);
    renderSettings();
  }

  function askKey() {
    ask(tr("Chave do TMDB", "TMDB key"), tr(
      "Use a “Chave da API” (32 letras e números) de themoviedb.org → Configurações → API. Dica: o app SmartThings no celular tem teclado para a TV.",
      "Use the “API Key” (32 letters and digits) from themoviedb.org → Settings → API. Tip: the SmartThings phone app has a keyboard for the TV."),
      "", function (v) {
        if (!v) return;
        Settings.set("tmdbKey", v);
        toast(tr("Chave salva. Buscando recomendações…", "Key saved. Fetching picks…"));
        Recs.refresh(true);
        renderAll();
      });
  }

  function askCity() {
    ask(tr("Cidade", "City"), tr("Digite o nome da cidade, por exemplo “Campinas” ou “Lisboa”.", "Type the city's name, like “Lisbon” or “Austin”."),
      "", function (v) {
        if (!v) return;
        findCity(v).then(function (c) {
          Settings.set("city", c.name);
          Settings.set("latitude", c.latitude);
          Settings.set("longitude", c.longitude);
          toast(c.name + (c.admin ? ", " + c.admin : "") + (c.country ? " · " + c.country : ""));
          HomeData.reload();
          renderSettings();
        }, function () { toast(tr("Não achei essa cidade", "Couldn't find that city")); });
      });
  }

  // MARK: - Screensaver

  var saverOn = false, saverTimer, saverList = [], saverIndex = 0, saverFlip = false;
  function clock() {
    var d = new Date(), loc = en() ? "en-US" : "pt-BR";
    $("clockT").textContent = d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
    $("clockD").textContent = d.toLocaleDateString(loc, { weekday: "long", day: "numeric", month: "long" });
  }
  function saverNext() {
    if (!saverList.length) return;
    var p = saverList[saverIndex++ % saverList.length];
    var a = $(saverFlip ? "svA" : "svB"), b = $(saverFlip ? "svB" : "svA");
    saverFlip = !saverFlip;
    a.onload = function () {
      a.classList.remove("on"); void a.offsetWidth; a.classList.add("on");
      b.classList.remove("on");
      $("saverName").textContent = p.title;
      $("saverMeta").textContent = p.meta;
    };
    a.src = Recs.image(p.backdrop, "w1280");
  }
  function showSaver() {
    if (saverOn || asking) return;
    saverOn = true;
    saverList = Recs.all();
    saverIndex = Math.floor(Math.random() * Math.max(1, saverList.length));
    $("saverName").textContent = "";
    $("saverMeta").textContent = "";
    clock();
    $("saver").classList.add("on");
    saverNext();
    saverTimer = setInterval(function () { clock(); }, 10e3);
    saverTimer2 = setInterval(saverNext, 20e3);
  }
  var saverTimer2;
  function hideSaver() {
    saverOn = false;
    clearInterval(saverTimer);
    clearInterval(saverTimer2);
    $("saver").classList.remove("on");
  }

  // MARK: - Night look

  function night() { document.body.classList.toggle("night", HomeData.isNight()); }

  // MARK: - Remote

  function move(list, i, step) { return Math.max(0, Math.min(list - 1, i + step)); }

  var handlers = {
    top: function (k) {
      var last = 2 + buttons.length;
      if (k === "LEFT" || k === "RIGHT") {
        S.top = move(last + 1, S.top, k === "LEFT" ? -1 : 1);
        if (S.top < 3 && S.top !== S.tab) { S.tab = S.top; S.card = 0; loadPicks(); }
      } else if (k === "DOWN") {
        S.zone = cardCount() ? "cards" : "shelf";
      } else if (k === "ENTER") {
        if (S.top === 3) openApps(false);
        else if (S.top === 4) openSettings(0);
        else S.zone = cardCount() ? "cards" : "shelf";
      } else if (k === "BACK") {
        S.zone = "shelf";
      }
    },
    cards: function (k) {
      if (k === "LEFT" || k === "RIGHT") S.card = move(cardCount(), S.card, k === "LEFT" ? -1 : 1);
      else if (k === "UP") { S.zone = "top"; S.top = S.tab; }
      else if (k === "DOWN" || k === "BACK") S.zone = "shelf";
      else if (k === "ENTER") {
        var st = cardsState();
        if (st === "nokey") openSettings(0);
        else if (st === "error") { Recs.refresh(true); renderCards(); }
        else if (picks[S.card]) {
          var p = picks[S.card], s = TV.service(p.app);
          open({ name: s ? s.name : p.app, id: TV.appId(p.app) });
        }
      }
    },
    shelf: function (k) {
      if (k === "LEFT" || k === "RIGHT") S.shelf = move(shelf.length, S.shelf, k === "LEFT" ? -1 : 1);
      else if (k === "UP") { if (cardCount()) S.zone = "cards"; else { S.zone = "top"; S.top = S.tab; } }
      else if (k === "DOWN") setDrawer(true);
      else if (k === "ENTER") open(shelf[S.shelf]);
    },
    drawer: function (k) {
      if (k === "UP" || k === "BACK") setDrawer(false);
      else if (k === "ENTER") open(shelf[S.shelf]);
    },
    apps: function (k) {
      if (k === "BACK") { closeSheet("appsSheet"); if (S.showIds) openSettings(rows.length - 1); return; }
      if (k === "LEFT" && S.grid % COLS) S.grid--;
      else if (k === "RIGHT" && S.grid % COLS < COLS - 1 && S.grid < grid.length - 1) S.grid++;
      else if (k === "UP" && S.grid >= COLS) S.grid -= COLS;
      else if (k === "DOWN" && S.grid + COLS < grid.length) S.grid += COLS;
      else if (k === "DOWN" && Math.floor(S.grid / COLS) < Math.floor((grid.length - 1) / COLS)) S.grid = grid.length - 1;
      else if (k === "ENTER" && grid[S.grid]) open(grid[S.grid]);
      renderGrid();
    },
    settings: function (k) {
      var r = rows[S.row];
      if (k === "BACK") { closeSheet("settingsSheet"); S.zone = "top"; S.top = 4; renderTop(); return; }
      if (k === "UP" || k === "DOWN") S.row = move(rows.length, S.row, k === "UP" ? -1 : 1);
      else if ((k === "LEFT" || k === "RIGHT") && r.options) { cycle(r, k === "LEFT" ? -1 : 1); return; }
      else if (k === "ENTER") { if (r.options) { cycle(r, 1); return; } r.enter(); return; }
      renderSettings();
    }
  };

  function onKey(e) {
    var k = TV.key(e);
    lastKey = Date.now();
    if (asking) {
      if (k === "DONE" || k === "ENTER") { e.preventDefault(); endAsk(true); }
      else if (k === "CANCEL" || e.keyCode === 10009 || e.keyCode === 27) { e.preventDefault(); endAsk(false); }
      return;
    }
    if (!k) return;
    e.preventDefault();
    if (saverOn) { hideSaver(); return; }
    var h = handlers[S.zone];
    if (h) h(k);
    if (S.zone !== "apps" && S.zone !== "settings") renderFocus();
  }

  function renderFocus() {
    renderTop();
    focusCards();
    renderShelf();
  }

  function renderAll() {
    renderTop();
    renderMini();
    loadPicks();
    renderCards();
    if (document.body.classList.contains("drawer")) renderDrawer();
    night();
  }

  // MARK: - Clock: every minute (new hour = new picks; night look; screensaver)

  function tick() {
    var h = Math.floor(Date.now() / 3600e3);
    if (h !== hour) { hour = h; Recs.refresh(); loadPicks(); }
    night();
    var min = Settings.get("screensaverMinutes");
    if (min > 0 && !saverOn && Date.now() - lastKey > min * 60e3) showSaver();
  }

  // MARK: - Start

  function start() {
    fit();
    window.addEventListener("resize", fit);
    texts();
    if (!TV.isTizen && window.FMT_DEMO) FMT_DEMO();
    TV.load(function () {
      buildShelf();
      Recs.refresh();
      loadPicks();
      renderAll();
    });
    Recs.listen(function () { loadPicks(); renderCards(); if (S.zone === "settings") renderSettings(); });
    HomeData.listen(function () { renderMini(); night(); if (document.body.classList.contains("drawer")) renderDrawer(); });
    HomeData.start();
    document.addEventListener("keydown", onKey);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { lastKey = Date.now(); TV.load(function () { buildShelf(); }); tick(); }
    });
    renderAll();
    setInterval(tick, 15e3);
    tick();
    window.FMT = { S: S, open: open, openApps: openApps, openSettings: openSettings, showSaver: showSaver, setDrawer: setDrawer, toast: toast };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
</body>
</html>
